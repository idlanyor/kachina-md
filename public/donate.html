<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donasi - Kachina Bot</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="output.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .glass-effect {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .gradient-text {
            background: linear-gradient(to right, #c13584, #f56040, #f77737);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 font-sans relative overflow-x-hidden bg-slate-900" x-data="donationPage()" x-init="init()" x-cloak>

    <!-- Navigation -->
    <nav class="glass-effect border-b border-white/10 shadow-xl sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <a href="/" class="flex items-center space-x-2 text-xl font-bold gradient-text">
                    <i class="bi bi-arrow-left"></i>
                    <span>Back to Dashboard</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8 relative z-10">
        <div class="max-w-4xl mx-auto">
            
            <!-- Hero Section -->
            <div class="text-center mb-12">
                <h1 class="text-4xl md:text-5xl font-extrabold mb-4 gradient-text">Dukung Kachina Bot</h1>
                <p class="text-slate-400 text-lg">Bantu kami menjaga server tetap hidup dan mengembangkan fitur baru.</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- QR Code / Payment Method -->
                <div class="glass-effect border border-white/10 rounded-2xl p-8 text-center shadow-2xl">
                    <h3 class="text-2xl font-bold mb-6">Scan QRIS</h3>
                    <div class="bg-white p-4 rounded-xl inline-block mb-6 mx-auto">
                         <!-- Replace with actual QR Code image path if available, or use placeholder text -->
                         <!-- <img src="/media/qris.jpg" alt="QRIS" class="w-64 h-64 object-contain"> -->
                         <div class="w-64 h-64 bg-slate-200 flex items-center justify-center text-slate-800">
                            <span class="text-center">
                                <i class="bi bi-qr-code text-6xl"></i><br>
                                QRIS Image Here<br>
                                (Upload to /media/qris.jpg)
                            </span>
                         </div>
                    </div>
                    <p class="text-slate-300 mb-6">Scan menggunakan GoPay, OVO, Dana, ShopeePay, atau Mobile Banking.</p>
                    <a href="https://saweria.co/yourusername" target="_blank" class="inline-block px-8 py-3 rounded-xl bg-gradient-to-r from-yellow-500 to-orange-500 text-white font-bold shadow-lg hover:shadow-orange-500/20 hover:-translate-y-0.5 transition-all">
                        <i class="bi bi-link-45deg me-2"></i>Link Saweria
                    </a>
                </div>

                <!-- Live Feed -->
                <div class="glass-effect border border-white/10 rounded-2xl p-6 shadow-2xl flex flex-col h-[500px]">
                    <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                        <h3 class="text-xl font-bold flex items-center">
                            <i class="bi bi-activity me-2 text-green-400"></i>
                            Live Donations
                        </h3>
                        <span class="text-xs px-2 py-1 rounded bg-green-500/20 text-green-400 border border-green-500/30 animate-pulse">
                            ● Live
                        </span>
                    </div>

                    <div class="flex-1 overflow-y-auto space-y-4 pr-2 custom-scrollbar">
                        <template x-for="donation in donations" :key="donation.id">
                            <div class="bg-slate-800/50 border border-white/5 rounded-xl p-4 transition-all hover:bg-slate-800 hover:border-white/10 animate-fade-in-down">
                                <div class="flex justify-between items-start mb-2">
                                    <span class="font-bold text-yellow-400" x-text="donation.donorName"></span>
                                    <span class="text-sm font-mono text-green-400" x-text="formatCurrency(donation.amount)"></span>
                                </div>
                                <p class="text-sm text-slate-300 italic mb-2" x-text="donation.message ? `&quot;${donation.message}&quot;` : 'No message'"></p>
                                <div class="text-xs text-slate-500 text-right" x-text="formatDate(donation.createdAt)"></div>
                            </div>
                        </template>
                        
                        <div x-show="donations.length === 0" class="text-center py-12 text-slate-500">
                            <i class="bi bi-heart text-4xl mb-2 block opacity-50"></i>
                            Belum ada donasi terbaru.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function donationPage() {
            return {
                donations: [],
                
                async init() {
                    await this.loadDonations();
                    this.connectStream();
                },

                async loadDonations() {
                    try {
                        const res = await fetch('/api/donations');
                        const data = await res.json();
                        if (data.success) {
                            this.donations = data.data;
                        }
                    } catch (e) {
                        console.error('Failed to load donations', e);
                    }
                },

                connectStream() {
                    const evtSource = new EventSource('/api/donations/stream');
                    
                    evtSource.onmessage = (event) => {
                        const newDonation = JSON.parse(event.data);
                        this.donations.unshift(newDonation);
                        // Keep list reasonable size
                        if (this.donations.length > 50) {
                            this.donations.pop();
                        }
                    };

                    evtSource.onerror = (err) => {
                        console.error("EventSource failed:", err);
                        // Optional: Retry logic is often built-in to browser's EventSource for connection loss
                    };
                },

                formatCurrency(amount) {
                    return new Intl.NumberFormat('id-ID', {
                        style: 'currency',
                        currency: 'IDR',
                        minimumFractionDigits: 0
                    }).format(amount);
                },

                formatDate(dateString) {
                    const date = new Date(dateString);
                    return new Intl.DateTimeFormat('id-ID', {
                        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
                    }).format(date);
                }
            }
        }
    </script>
    
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-down {
            animation: fadeInDown 0.5s ease-out forwards;
        }
    </style>
</body>
</html>
